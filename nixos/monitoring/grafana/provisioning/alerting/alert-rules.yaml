# Grafana unified alerting — Ace service health and version lag.
# Provisioned from nixos/monitoring/grafana-alerting.nix
apiVersion: 1
groups:
  - orgId: 1
    name: ace-service-health
    folder: Ace Alerts
    interval: 1m
    rules:
      - uid: ace_probe_failed
        title: Ace service probe failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              # 1 per failing probe, 0 per healthy one, so threshold C (> 0) fires
              # per series. The old "== 0" filter returned only zeros, and 0 > 0
              # never fired.
              expr: 1 - probe_success{probe_location=~"local|lan",job=~"blackbox.*",service_tier="essential"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          description: >-
            Blackbox probe {{ $labels.job }} for {{ $labels.instance }}
            ({{ $labels.probe_location }}) has been failing for at least 5 minutes.
          summary: Service probe failed — {{ $labels.instance }}
        labels:
          severity: critical
          alert_type: service_down

      - uid: ace_scrape_down
        title: Ace Prometheus scrape target down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              # 1 per target Prometheus cannot scrape (exporter or service down).
              expr: 1 - up
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          description: >-
            Prometheus job {{ $labels.job }} target {{ $labels.instance }} has been
            unscrapeable for at least 10 minutes.
          summary: Scrape target down — {{ $labels.job }} {{ $labels.instance }}
        labels:
          severity: warning
          alert_type: monitoring

      - uid: ace_metrics_absent
        title: Ace monitoring series missing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              # absent() returns 1 (labelled with the job) when a whole job has
              # vanished, which the per-series rules above cannot see.
              expr: >-
                absent(up{job="node"})
                or absent(up{job="pushgateway-external"})
                or absent(probe_success{job="blackbox-http"})
                or absent(probe_success{job="external-http-probe"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # No data means every series is present.
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          description: >-
            No {{ $labels.job }} series in Prometheus for 10 minutes; that job's
            alerts cannot fire.
          summary: Monitoring series missing — {{ $labels.job }}
        labels:
          severity: warning
          alert_type: monitoring

      - uid: ace_pushgateway_stale
        title: Ace external probe push stale
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              # Seconds since crux last pushed; the Pushgateway keeps serving the old
              # values forever, so probe_success alone never goes stale.
              expr: time() - max by (job) (push_time_seconds{job="external-http-probe"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1200
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          description: >-
            crux has not pushed external probe results for over 20 minutes
            (timer runs every 5). External probe data in Grafana is stale.
          summary: External probe push stale
        labels:
          severity: warning
          alert_type: monitoring

  - orgId: 1
    name: ace-version-updates
    folder: Ace Alerts
    interval: 5m
    rules:
      - uid: ace_version_major
        title: Ace service major version behind
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: ace_service_version_behind{service=~"grafana|prometheus|nextcloud|zitadel|matrix-synapse|technitium|jellyfin|vaultwarden|pterodactyl-panel|notify_push"} == 3
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          description: >-
            {{ $labels.service }} is on {{ $labels.current }}; latest upstream is
            {{ $labels.latest }} (major version behind).
          summary: Major update available — {{ $labels.service }}
        labels:
          severity: critical
          alert_type: version_major

      - uid: ace_version_minor
        title: Ace service minor or patch update available
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: ace_service_version_behind{service=~"grafana|prometheus|nextcloud|zitadel|matrix-synapse|technitium|jellyfin|vaultwarden|pterodactyl-panel|notify_push"} == 1 or ace_service_version_behind{service=~"grafana|prometheus|nextcloud|zitadel|matrix-synapse|technitium|jellyfin|vaultwarden|pterodactyl-panel|notify_push"} == 2
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 1h
        annotations:
          description: >-
            {{ $labels.service }} is on {{ $labels.current }}; latest upstream is
            {{ $labels.latest }} (patch or minor update available).
          summary: Update available — {{ $labels.service }}
        labels:
          severity: warning
          alert_type: version_update
