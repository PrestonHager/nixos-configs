# Grafana unified alerting — Security folder (Phase 2).
# Tier 1 email alerts; tune thresholds after baselining in Loki Explore.
apiVersion: 1
groups:
  - orgId: 1
    name: security-ssh-abuse
    folder: Security
    interval: 1m
    rules:
      - uid: sec_ssh_failed_burst
        title: SSH authentication failure burst
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              # != "org_id=": Loki logs every query it runs (org_id=fake ...), and
              # this query's own text contains the search words, so it matched itself.
              expr: >-
                sum by (host) (count_over_time({job="systemd-journal"}
                != "org_id=" |~ "Failed password|Invalid user" [5m])) > 10
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          description: >-
            More than 10 SSH auth failures in 5 minutes on host {{ $labels.host }}.
            Check fail2ban and auth logs in Loki.
          summary: SSH auth failure burst — {{ $labels.host }}
        labels:
          severity: warning
          alert_type: ssh_abuse

  - orgId: 1
    name: security-drift
    folder: Security
    interval: 5m
    rules:
      - uid: sec_git_drift
        title: NixOS git config drift detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: homelab_git_drift == 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          description: >-
            /etc/nixos on {{ $labels.host }} has uncommitted changes or diverged from origin.
          summary: Git drift — {{ $labels.host }}
        labels:
          severity: warning
          alert_type: config_drift

      - uid: sec_cisco_config_drift
        title: Cisco running-config changed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: homelab_cisco_config_drift == 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          description: >-
            Astracap or Astraquasar running-config differs from the previous daily backup.
            Diff files under /var/lib/cisco-config-backup/.
          summary: Cisco config drift detected
        labels:
          severity: warning
          alert_type: cisco_drift

  - orgId: 1
    name: security-network-ids
    folder: Security
    interval: 1m
    rules:
      - uid: sec_suricata_scan
        title: Suricata scan or exploit alert
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              # SYN-scan hits from the static infra range (.1-.20: router, switch, ace,
              # nodes) are blackbox probes and log shipping, not scans. Everything else,
              # including SYN scans from LAN clients, still alerts.
              # Only severity 1-2 (high/medium) pages; ET Open's severity-3 INFO and
              # POLICY hits stay in Loki for triage.
              # One series per signature, so the email names what fired.
              expr: >-
                sum by (alert_signature) (count_over_time({job="suricata"} | json | event_type="alert" and alert_severity <= 2
                and (alert_signature != "ET SCAN SYN Scan detected" or src_ip !~ "192\\.168\\.5\\.([1-9]|1[0-9]|20)") [5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 1m
        # Scanners come in bursts a few minutes apart; without this each gap
        # resolved the alert and the next burst sent another email.
        keepFiringFor: 30m
        annotations:
          summary: "Suricata: {{ $labels.alert_signature }}"
          description: >-
            {{ $values.A.Value }} Suricata alert event(s) in the last 5 minutes for
            "{{ $labels.alert_signature }}". Use "Go to dashboard" below for who sent
            it, which host and port it hit, the HTTP status, and the raw events.
          runbook_url: https://serverdocs.prestonhager.com/shared/security-ids-test-cases.html
          __dashboardUid__: suricata-alerts
          __panelId__: "10"
        labels:
          severity: warning
          alert_type: suricata
  - orgId: 1
    name: security-abuseipdb
    folder: Security
    interval: 5m
    rules:
      - uid: sec_abuseipdb_sync
        title: AbuseIPDB blocklist not updating
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: (homelab_abuseipdb_configured == 1) and on() ((time() - homelab_abuseipdb_last_run_timestamp_seconds > 43200) or on() (max(homelab_abuseipdb_sync_success) == 0))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 30m
        annotations:
          description: >-
            The AbuseIPDB blacklist sync has not run in 12 hours or its last run failed. After 48 hours without a fresh list, every blackhole route is withdrawn. Check: journalctl -u abuseipdb-blackhole-sync.
          summary: AbuseIPDB blocklist is not updating
          runbook_url: https://serverdocs.prestonhager.com/shared/network-abuseipdb-blackhole.html
        labels:
          severity: warning
          alert_type: abuseipdb_blackhole
      - uid: sec_abuseipdb_bgp
        title: AbuseIPDB blackhole BGP session down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: homelab_abuseipdb_bgp_established{router_expected="1"} == 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          description: >-
            BIRD on ace has no BGP session to Astracap, so the router is not blocking AbuseIPDB-listed addresses (it fails open). Check: birdc show protocols all astracap; on the router: show ip bgp summary.
          summary: AbuseIPDB blackhole BGP session to Astracap is down
          runbook_url: https://serverdocs.prestonhager.com/shared/network-abuseipdb-blackhole.html
        labels:
          severity: warning
          alert_type: abuseipdb_blackhole
