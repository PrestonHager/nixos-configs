# Route all Ace provisioned alerts to the ace-email contact point.
apiVersion: 1
policies:
  - orgId: 1
    receiver: ace-email
    group_by:
      - alertname
      - grafana_folder
      - severity
    group_wait: 30s
    group_interval: 5m
    # Mail when something breaks, then a reminder while it stays broken: twice a
    # day for critical, daily otherwise (was hourly / 12h / 4h).
    repeat_interval: 24h
    routes:
      - receiver: ace-email
        object_matchers:
          - - severity
            - =
            - critical
        group_wait: 10s
        repeat_interval: 12h
      - receiver: ace-email
        object_matchers:
          - - severity
            - =
            - warning
        repeat_interval: 24h
